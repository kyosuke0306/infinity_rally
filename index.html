<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>infinity rally</title>
<meta name="description" content="Pounded corner to corner, the runner keeps chasing down every ball. An endless tennis rally to just watch.">
<meta name="theme-color" content="#070b18">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script src="version.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span class="label">RALLY</span><span id="rally">0</span></div>
<div id="msg"></div>
<div id="controls">
  <button id="btnCam" title="Switch camera">📷 <span id="camName">TV</span></button>
  <button id="btnAuto" title="Auto camera">🔁 Auto <span id="autoState">ON</span></button>
  <button id="btnSlow" title="Slow motion on close calls">🐢 Slow-mo <span id="slowState">ON</span></button>
  <button id="btnSound" title="Sound">🔈 Sound <span id="soundState">OFF</span></button>
  <button id="btnFull" title="Fullscreen">⛶</button>
</div>
<div id="ver"><div class="name">infinity rally</div><div id="verText"></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
