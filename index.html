<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>infinity rally</title>
<meta name="description" content="Pounded corner to corner, the runner keeps chasing down every ball. An endless tennis rally to just watch.">
<meta name="theme-color" content="#070b18">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script src="version.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span class="label">RALLY</span><span id="rally">0</span></div>
<div id="msg"></div>
<div id="controls">
  <button id="btnCam" title="Switch camera"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg> <span id="camName">TV</span></button>
  <button id="btnAuto" title="Auto camera"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 0 1 14-5l2 2"/><path d="M20 3v5h-5"/><path d="M20 13a8 8 0 0 1-14 5l-2-2"/><path d="M4 21v-5h5"/></svg> Auto <span id="autoState">ON</span></button>
  <button id="btnSlow" title="Slow motion on close calls"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l-3 2"/><path d="M10 2h4"/></svg> Slow-mo <span id="slowState">ON</span></button>
  <button id="btnSound" title="Sound"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg> Sound <span id="soundState">OFF</span></button>
  <button id="btnFull" title="Fullscreen" aria-label="Fullscreen"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5"/><path d="M15 4h5v5"/><path d="M20 15v5h-5"/><path d="M9 20H4v-5"/></svg></button>
</div>
<div id="ver"><div class="name">infinity rally</div><div id="verText"></div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
